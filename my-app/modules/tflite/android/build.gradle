apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'my.app.tflite'
version = '1.0.0'

android {
  compileSdkVersion project.findProperty('android.compileSdkVersion')?.toInteger() ?: 34
  namespace "my.app.tflite"
  defaultConfig {
    minSdkVersion project.findProperty('android.minSdkVersion')?.toInteger() ?: 23
    targetSdkVersion project.findProperty('android.targetSdkVersion')?.toInteger() ?: 34
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${project.findProperty('kotlinVersion') ?: '1.9.22'}"
  implementation 'org.tensorflow:tensorflow-lite:2.14.0'
}
